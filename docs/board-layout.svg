<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="760" height="330" fill="#0f1115"/>
  <text x="20" y="30" fill="#e6e6e6" font-size="16" font-weight="600">Adafruit Neo Trinkey, component side up, USB plug to the left</text>

  <!-- board -->
  <rect x="60" y="80" width="560" height="150" rx="10" fill="#4a2a7a" stroke="#6e45a8" stroke-width="2"/>
  <!-- usb contacts -->
  <g fill="#d8b24a">
    <rect x="80" y="100" width="90" height="12" rx="3"/><rect x="80" y="128" width="90" height="12" rx="3"/>
    <rect x="80" y="156" width="90" height="12" rx="3"/><rect x="80" y="184" width="90" height="12" rx="3"/>
  </g>
  <text x="125" y="222" fill="#c9b8e8" font-size="11" text-anchor="middle">USB-A</text>
  <!-- chip + reset -->
  <rect x="215" y="120" width="60" height="60" rx="4" fill="#1a1a1a" stroke="#333"/>
  <text x="245" y="154" fill="#aaa" font-size="9" text-anchor="middle">SAMD21</text>
  <circle cx="315" cy="150" r="14" fill="#333" stroke="#777" stroke-width="2"/>
  <text x="315" y="185" fill="#c9b8e8" font-size="11" text-anchor="middle">reset</text>

  <!-- pixels -->
  <g>
    <circle cx="420" cy="120" r="22" fill="#00e5ff" filter="url(#glow)" opacity=".55"/><circle cx="420" cy="120" r="18" fill="#00e5ff"/>
    <text x="420" y="125" fill="#002b33" font-size="15" font-weight="700" text-anchor="middle">0</text>
    <circle cx="500" cy="120" r="22" fill="#ffb000" filter="url(#glow)" opacity=".55"/><circle cx="500" cy="120" r="18" fill="#ffb000"/>
    <text x="500" y="125" fill="#332200" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <circle cx="500" cy="190" r="22" fill="#30d158" filter="url(#glow)" opacity=".55"/><circle cx="500" cy="190" r="18" fill="#30d158"/>
    <text x="500" y="195" fill="#062b12" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <circle cx="420" cy="190" r="22" fill="#7c5cff" filter="url(#glow)" opacity=".55"/><circle cx="420" cy="190" r="18" fill="#7c5cff"/>
    <text x="420" y="195" fill="#120a33" font-size="15" font-weight="700" text-anchor="middle">3</text>
  </g>
  <!-- touch pads -->
  <rect x="560" y="92" width="44" height="56" rx="5" fill="#d8b24a"/>
  <text x="582" y="126" fill="#3a2a00" font-size="18" font-weight="700" text-anchor="middle">2</text>
  <rect x="560" y="162" width="44" height="56" rx="5" fill="#d8b24a"/>
  <text x="582" y="196" fill="#3a2a00" font-size="18" font-weight="700" text-anchor="middle">1</text>

  <!-- annotations -->
  <g fill="#e6e6e6" font-size="13">
    <text x="640" y="112">pad 2</text>
    <text x="640" y="130" fill="#9aa" font-size="12">tap: cycle layout</text>
    <text x="640" y="146" fill="#9aa" font-size="12">hold: brighter</text>
    <text x="640" y="184">pad 1</text>
    <text x="640" y="202" fill="#9aa" font-size="12">tap: acknowledge</text>
    <text x="640" y="218" fill="#9aa" font-size="12">hold: dimmer</text>
  </g>
  <g fill="#e6e6e6" font-size="13">
    <text x="60" y="268" font-weight="600">Each pixel is one agent session</text>
    <text x="60" y="290" fill="#cfd3d8">A session takes the lowest free pixel when it starts (0, then 1, 2, 3 clockwise) and keeps it until it ends.</text>
    <text x="60" y="310" fill="#cfd3d8">The color and motion of that pixel is that agent's state. Nothing is grouped or summarized.</text>
  </g>
</svg>
