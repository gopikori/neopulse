<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    @keyframes breathe { 0%,100% { opacity:.2 } 50% { opacity:1 } }
    @keyframes dpulse  { 0%,37.5%,100% { opacity:.15 } 12.5%,62.5% { opacity:1 } 25%,75% { opacity:.4 } 50% { opacity:.15 } }
    @keyframes blink   { 0%,25% { opacity:1 } 12.5%,37.5%,100% { opacity:.15 } }
    .w { animation: breathe 2s ease-in-out infinite } .n { animation: dpulse 2s linear infinite } .b { animation: blink 2s steps(1) infinite }
    text { fill:#e6e6e6 } .dim { fill:#9aa3ad } .num { fill:#111; font-weight:700; font-size:12px }
  </style>
  <rect width="760" height="580" fill="#0f1115"/>
  <text x="20" y="30" font-size="16" font-weight="600">Worked examples (board held USB-left, pads on the right)</text>
<g transform="translate(20,50)">
<rect width="150" height="90" rx="8" fill="#4a2a7a"/><rect x="128" y="10" width="14" height="30" rx="3" fill="#d8b24a"/><rect x="128" y="50" width="14" height="30" rx="3" fill="#d8b24a"/>
<circle cx="45" cy="28" r="16" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".7"/>
<circle cx="45" cy="28" r="13" fill="#00e5ff" class="w"/>
<text x="45" y="32" text-anchor="middle" class="num">0</text>
<circle cx="105" cy="28" r="13" fill="#1a1326" stroke="#2a1f3d"/>
<circle cx="105" cy="62" r="13" fill="#1a1326" stroke="#2a1f3d"/>
<circle cx="45" cy="62" r="13" fill="#1a1326" stroke="#2a1f3d"/>
<text x="170" y="30" font-size="14" font-weight="600">One Claude session, working</text>
<text x="170" y="52" font-size="12" class="dim">Pixel 0 breathes cyan. The other three stay off.</text>
</g>
<g transform="translate(20,158)">
<rect width="150" height="90" rx="8" fill="#4a2a7a"/><rect x="128" y="10" width="14" height="30" rx="3" fill="#d8b24a"/><rect x="128" y="50" width="14" height="30" rx="3" fill="#d8b24a"/>
<circle cx="45" cy="28" r="16" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".7"/>
<circle cx="45" cy="28" r="13" fill="#00e5ff" class="w"/>
<text x="45" y="32" text-anchor="middle" class="num">0</text>
<circle cx="105" cy="28" r="16" fill="none" stroke="#ffb000" stroke-width="2" opacity=".7"/>
<circle cx="105" cy="28" r="13" fill="#ffb000" class="n"/>
<text x="105" y="32" text-anchor="middle" class="num">1</text>
<circle cx="105" cy="62" r="13" fill="#1a1326" stroke="#2a1f3d"/>
<circle cx="45" cy="62" r="13" fill="#1a1326" stroke="#2a1f3d"/>
<text x="170" y="30" font-size="14" font-weight="600">A Codex session starts, then needs you</text>
<text x="170" y="52" font-size="12" class="dim">It took pixel 1 when it started and keeps it. Amber double pulse = needs you.</text>
</g>
<g transform="translate(20,266)">
<rect width="150" height="90" rx="8" fill="#4a2a7a"/><rect x="128" y="10" width="14" height="30" rx="3" fill="#d8b24a"/><rect x="128" y="50" width="14" height="30" rx="3" fill="#d8b24a"/>
<circle cx="45" cy="28" r="16" fill="none" stroke="#30d158" stroke-width="2" opacity=".7"/>
<circle cx="45" cy="28" r="13" fill="#30d158"/>
<text x="45" y="32" text-anchor="middle" class="num">0</text>
<circle cx="105" cy="28" r="16" fill="none" stroke="#7c5cff" stroke-width="2" opacity=".7"/>
<circle cx="105" cy="28" r="13" fill="#7c5cff" class="w"/>
<text x="105" y="32" text-anchor="middle" class="num">1</text>
<circle cx="105" cy="62" r="16" fill="none" stroke="#ff2a2a" stroke-width="2" opacity=".7"/>
<circle cx="105" cy="62" r="13" fill="#ff2a2a" class="b"/>
<text x="105" y="66" text-anchor="middle" class="num">2</text>
<circle cx="45" cy="62" r="13" fill="#1a1326" stroke="#2a1f3d"/>
<text x="170" y="30" font-size="14" font-weight="600">Three sessions</text>
<text x="170" y="52" font-size="12" class="dim">0 Claude done (solid green)</text>
<text x="170" y="70" font-size="12" class="dim">1 Codex working (violet breathe)</text>
<text x="170" y="88" font-size="12" class="dim">2 Claude blocked (red double blink)</text>
</g>
<g transform="translate(20,374)">
<rect width="150" height="90" rx="8" fill="#4a2a7a"/><rect x="128" y="10" width="14" height="30" rx="3" fill="#d8b24a"/><rect x="128" y="50" width="14" height="30" rx="3" fill="#d8b24a"/>
<circle cx="45" cy="28" r="16" fill="none" stroke="#ffb000" stroke-width="2" opacity=".7"/>
<circle cx="45" cy="28" r="13" fill="#ffb000" class="n"/>
<text x="45" y="32" text-anchor="middle" class="num">0</text>
<circle cx="105" cy="28" r="16" fill="none" stroke="#ffb000" stroke-width="2" opacity=".7"/>
<circle cx="105" cy="28" r="13" fill="#ffb000" class="n"/>
<text x="105" y="32" text-anchor="middle" class="num">1</text>
<circle cx="105" cy="62" r="16" fill="none" stroke="#ffb000" stroke-width="2" opacity=".7"/>
<circle cx="105" cy="62" r="13" fill="#ffb000" class="n"/>
<text x="105" y="66" text-anchor="middle" class="num">2</text>
<circle cx="45" cy="62" r="16" fill="none" stroke="#ffb000" stroke-width="2" opacity=".7"/>
<circle cx="45" cy="62" r="13" fill="#ffb000" class="n"/>
<text x="45" y="66" text-anchor="middle" class="num">3</text>
<text x="170" y="30" font-size="14" font-weight="600">Unified mode (tap pad 2)</text>
<text x="170" y="52" font-size="12" class="dim">All four pixels show the single most urgent state across every session.</text>
</g>
  <g transform="translate(20,500)" font-size="12">
    <text font-size="13" font-weight="600">Rules</text>
    <text y="20" class="dim">1. A session takes the lowest free pixel when it starts and keeps it until it ends, 20 min after done, or 5 min idle.</text>
    <text y="38" class="dim">2. Color and motion both encode state: cyan/violet breathe = working, amber pulse = needs you, red blink = blocked, green = done.</text>
    <text y="56" class="dim">3. A fifth session waits for a free pixel. `neopulse status` lists who owns which pixel. Pad 1 tap clears done and needs-you.</text>
  </g>
</svg>
