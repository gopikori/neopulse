[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neopulse"
version = "0.2.0"
description = "Open-source USB status light for AI coding agents (Claude Code, Codex) on Adafruit Neo Trinkey and other CircuitPython NeoPixel boards."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
keywords = ["neopixel", "status-light", "claude-code", "codex", "circuitpython", "trinkey"]

[project.scripts]
neopulse = "neopulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
mac = ["rumps>=0.4"]

[tool.setuptools.packages.find]
include = ["neopulse*"]

[tool.setuptools.package-data]
neopulse = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
